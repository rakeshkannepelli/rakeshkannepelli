      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.54;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="550" y1="115" x2="550" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="550;570;570;550" keyTimes="0;0.57;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.54;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- N -->
    <text x="600" y="100" class="letter" opacity="0">
      N
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.61;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="600" y1="115" x2="600" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="600;620;620;600" keyTimes="0;0.64;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.61;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- N -->
    <text x="650" y="100" class="letter" opacity="0">
      N
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.68;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="650" y1="115" x2="650" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="650;670;670;650" keyTimes="0;0.71;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.68;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- E -->
    <text x="700" y="100" class="letter" opacity="0">
