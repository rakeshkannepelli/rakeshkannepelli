      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.82;0.85;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="750" y1="115" x2="750" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="750;770;770;750" keyTimes="0;0.82;0.85;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.82;0.85;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- L -->
    <text x="800" y="100" class="letter" opacity="0">
      L
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.85;0.88;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="800" y1="115" x2="800" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="800;820;820;800" keyTimes="0;0.85;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.85;0.88;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- I -->
    <text x="850" y="100" class="letter" opacity="0">
      I
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.88;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="850" y1="115" x2="850" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="850;870;870;850" keyTimes="0;0.88;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.88;0.92;1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
