      <animate attributeName="x2" values="420;440;440;420" keyTimes="0;0.43;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Space -->

    <!-- K -->
    <text x="500" y="100" class="letter" opacity="0">
      K
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.47;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="500" y1="115" x2="500" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="500;520;520;500" keyTimes="0;0.5;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.47;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- A -->
    <text x="550" y="100" class="letter" opacity="0">
