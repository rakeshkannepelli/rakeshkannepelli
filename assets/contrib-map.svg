<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
      
      .letter {
        font-family: 'Courier Prime', monospace;
        font-size: 48px;
        font-weight: 700;
        fill: #00D9FF;
        letter-spacing: 3px;
      }
      
      .underline {
        stroke: #00D9FF;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="#0D1117"/>

  <!-- Animated letters with cinematic underline effect -->
  <g class="letter-container">
    <!-- R -->
    <text x="150" y="100" class="letter" opacity="0">
      R
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="150" y1="115" x2="150" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="150;170;170;150" keyTimes="0;0.08;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- A -->
    <text x="200" y="100" class="letter" opacity="0">
      A
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="200" y1="115" x2="200" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="200;220;220;200" keyTimes="0;0.15;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- K -->
    <text x="250" y="100" class="letter" opacity="0">
      K
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.19;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="250" y1="115" x2="250" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="250;270;270;250" keyTimes="0;0.22;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.19;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- E -->
    <text x="300" y="100" class="letter" opacity="0">
      E
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.26;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="300" y1="115" x2="300" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="300;320;320;300" keyTimes="0;0.29;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.26;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- S -->
    <text x="350" y="100" class="letter" opacity="0">
      S
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.8;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <line x1="350" y1="115" x2="350" y2="115" class="underline" opacity="0">
      <animate attributeName="x2" values="350;370;370;350" keyTimes="0;0.36;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.8;1" dur="6s" repeatCount="indefinite"/>
    </line>

